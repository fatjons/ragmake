[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragmake"
version = "0.2.0"
description = "Stateful RAG kernel: compile documents into persistent state and corpus nectar, rebuild only what changed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["rag", "retrieval", "llm", "stateful", "incremental", "agent", "nectar"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
azure = [
  "azure-search-documents>=11.6.0",
  "azure-storage-blob>=12.0.0",
]
postgres = [
  "pgvector>=0.2.0",
  "psycopg[binary]>=3.1.0",
]
numpy = ["numpy>=1.24"]

[project.scripts]
ragmake = "ragmake.cli:main"
ragmake-benchmark = "ragmake.benchmark:main"

[tool.setuptools]
packages = ["ragmake", "ragmake.adapters"]
